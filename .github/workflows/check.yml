name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Pinned to a tag so a change in the gate cannot turn this build red on its own.
      - run: pip install "mutt_check @ git+https://github.com/nlmundis/mutt_check@v0.0.2"
      - run: make check PYTHON=python
