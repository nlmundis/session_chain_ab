name: check

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this same gate on the tagged commit before publishing.
  workflow_call:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # ruff, mypy and mutt_check, each pinned so a new release cannot turn this build red on its own.
      - run: pip install -r requirements-dev.txt
      - run: make check PYTHON=python

  # The one check branch protection requires. Requiring each matrix job by name
  # would silently stop protecting main the day the matrix changes.
  all-checks:
    name: all checks passed
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check.result }}" = "success"
